version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: local_nginx_proxy
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - default

networks:
  default:
    name: supabase_network_sistema-estoque
    external: true
